<!doctype html>
<html lang="en" data-theme="matrix">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ops Panel</title>
  <meta name="theme-color" content="#050807" />
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/js/main.js"></script>
  <script defer src="../assets/js/admin.js"></script>
</head>
<body>
<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="./"><span class="glyph">◇</span> Ops</a>
    <nav aria-label="Secondary" class="nav">
      <a class="nav-link active" href="./" aria-current=page>Dashboard</a>
      <a class="nav-link" href="./guides.html">Guides</a>
      <a class="nav-link" href="./services.html">Service playbooks</a>
    </nav>
  </div>
</header>
<main class="container" role="main">
  <section class="card">
    <h1>Ops Panel</h1>
    <p class="muted">Analytics, content audit, service playbooks, and tools. Configure data sources in <code>assets/js/config.js</code>.</p>
    <div class="grid cols-3" style="margin-bottom:12px;">
      <div>
        <h3>Top pages (Umami)</h3>
        <div id="umami"></div>
      </div>
      <div>
        <h3>Leads</h3>
        <div id="leads"></div>
      </div>
      <div>
        <h3>Mentions</h3>
        <div id="wm"></div>
      </div>
    </div>
    <div class="grid cols-3">
      <div class="card"><h3>Content audit</h3>
        <div id="audit-controls" style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
          <label class="small-label"><input type="checkbox" id="audit-only-issues"> Only issues</label>
          <button class="btn small" id="audit-rescan" type="button">Rescan</button>
          <button class="btn small" id="audit-export" type="button">Export CSV</button>
          <span id="audit-summary" class="small-label" style="margin-left:auto;"></span>
        </div>
        <div id="audit"></div>
      </div>
      <div class="card"><h3>Tools</h3><div id="tools"></div></div>
      <div class="card"><h3>Service PDFs</h3><div id="pdfs"></div></div>
    </div>
  </section>
</main>
</body>
</html>

      if (window.CMS) {

      }
    </script>
  </body>
</html>
