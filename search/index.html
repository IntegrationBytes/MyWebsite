<!doctype html>
<html lang="en" data-theme="matrix">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search — Vincent Viitala</title>
  <meta name="description" content="Instant, privacy‑friendly search across essays and projects." />
  <meta name="theme-color" content="#050807" />
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="preload" href="/_pagefind/pagefind.js" as="script">
  <link rel="preload" href="/_pagefind/elasticlunr.js" as="script">
  <script defer src="../assets/js/main.js"></script>
  <style>
    .pf { max-width: 900px; margin: 0 auto; }
    .pf .pagefind-ui__form { margin: 16px 0; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', async function(){
      try {
        const { PagefindUI } = await import('/_pagefind/pagefind-ui.js');
        new PagefindUI({ element: document.querySelector('#search'), showSubResults: true, baseUrl: '/', resetStyles: false });
      } catch (e) { console.warn('Search unavailable', e); }
    });
  </script>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="../"><span class="glyph">◇</span> Vincent Viitala</a>
      <nav aria-label="Primary" class="nav">
        <a class="nav-link" href="../projects/">Projects</a>
        <a class="nav-link" href="../links/">Links</a>
        <a class="nav-link" href="../cv/">CV / About</a>
        <a class="nav-link" href="../contact/">Contact</a>
      </nav>
      <div class="header-actions">
        <button id="cmdk" class="btn btn-ghost" aria-label="Open Command Palette (Ctrl/⌘K)"><span>⌘K</span></button>
      </div>
    </div>
  </header>
  <div id="progress" class="progress" aria-hidden="true"><span></span></div>
  <main class="container" role="main">
    <section class="pf">
      <h1>Search</h1>
      <div id="search"></div>
      <noscript><p class="muted">Enable JavaScript to use search.</p></noscript>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div class="left">
        <p class="muted">© 2025 Vincent Viitala — “Reading the code behind appearance.”</p>
        <p class="muted">WCAG AA. Built with vanilla HTML/CSS/JS. </p>
      </div>
      <div class="right">
        <a href="../rss.xml" class="tag">RSS</a>
        <a href="https://github.com/" target="_blank" rel="noopener" class="tag">GitHub</a>
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener" class="tag">LinkedIn</a>
        <a href="../contact/" class="tag">Contact</a>
      </div>
    </div>
  </footer>
  <script defer src="/_pagefind/pagefind.js"></script>
</body>
</html>
