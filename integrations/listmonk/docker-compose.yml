services:
  db:
    image: postgres:14
    container_name: listmonk-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_DB: listmonk
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 5s
      timeout: 5s
      retries: 20
  listmonk-migrate:
    image: listmonk/listmonk:latest
    container_name: listmonk-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.toml:/listmonk/config.toml:ro
    command: ["/listmonk/listmonk", "--install", "--yes", "--config", "/listmonk/config.toml"]
    restart: "no"
  listmonk:
    image: listmonk/listmonk:latest
    container_name: listmonk
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./config.toml:/listmonk/config.toml:ro
    command: ["/listmonk/listmonk", "--config", "/listmonk/config.toml"]

volumes:
  db:

