<body>

<!-- Language Picker -->
<div class="picker-page">
  <div class="picker-card">
    <div class="picker-glyph"></div>
    <h1 class="picker-title">Vincent Viitala</h1>
    <p class="picker-subtitle">AI-Native Transformation for SMEs · Choose your language</p>
    <div class="picker-grid">
      <a class="picker-option" href="/fi/">
        <span class="picker-flag"></span>
        <span class="picker-lang">Suomi</span>
        <span class="picker-lang-sub">Finnish</span>
      </a>
      <a class="picker-option" href="/en/">
        <span class="picker-flag"></span>
        <span class="picker-lang">English</span>
        <span class="picker-lang-sub">International</span>
      </a>
      <a class="picker-option" href="/es/">
        <span class="picker-flag"></span>
        <span class="picker-lang">Español</span>
        <span class="picker-lang-sub">España & LATAM</span>
      </a>
    </div>
  </div>
</div>

<script>
// Redirect by visitor IP location (Cloudflare). Finland -> Finnish, everyone else -> English.
// Cache-safe: the country is read fresh per visitor from /cdn-cgi/trace, so an edge-cached
// shell can't pin every visitor to one language. The picker above is the no-JS fallback.
(function(){
  var done = false;
  function go(lang){ if (done) return; done = true; window.location.replace(lang === 'fi' ? '/fi/' : '/en/'); }
  try {
    fetch('/cdn-cgi/trace', { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(t){ var m = t.match(/^loc=([A-Z]{2})/m); go(m && m[1] === 'FI' ? 'fi' : 'en'); })
      .catch(function(){ go('en'); });
  } catch (e) { go('en'); }
  // Safety net if the trace request hangs or is blocked: default to English.
  setTimeout(function(){ go('en'); }, 2500);
})();
</script>

</body>
