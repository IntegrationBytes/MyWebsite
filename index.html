<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vincent Viitala – AI-Native Transformation for SMEs</title>
  <meta name="description" content="I install the agent infrastructure that turns a normal SME into an AI-native company. 60–90 day build, then a monthly AgentOps retainer. Value-based pricing." />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" hreflang="fi" href="/fi/" />
  <link rel="alternate" hreflang="en" href="/en/" />
  <link rel="alternate" hreflang="es" href="/es/" />
  <link rel="alternate" hreflang="x-default" href="/en/" />
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vincent Viitala – AI-Native Transformation for SMEs">
  <meta property="og:description" content="I install the agent infrastructure that turns a normal SME into an AI-native company. 60–90 day build, then a monthly AgentOps retainer.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="assets/img/og-default.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/executive-dark.css">
  <script defer src="assets/js/config.js"></script>
</head>
<body>

<!-- Language Picker -->
<div class="picker-page">
  <div class="picker-card">
    <div class="picker-glyph">◇</div>
    <h1 class="picker-title">Vincent Viitala</h1>
    <p class="picker-subtitle">AI-Native Transformation for SMEs · Choose your language</p>
    <div class="picker-grid">
      <a class="picker-option" href="/fi/">
        <span class="picker-flag">🇫🇮</span>
        <span class="picker-lang">Suomi</span>
        <span class="picker-lang-sub">Finnish</span>
      </a>
      <a class="picker-option" href="/en/">
        <span class="picker-flag">🌍</span>
        <span class="picker-lang">English</span>
        <span class="picker-lang-sub">International</span>
      </a>
      <a class="picker-option" href="/es/">
        <span class="picker-flag">🌎</span>
        <span class="picker-lang">Español</span>
        <span class="picker-lang-sub">España & LATAM</span>
      </a>
    </div>
  </div>
</div>

<script>
// Auto-redirect based on browser language preference
(function(){
  const lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if (lang.startsWith('fi')) { window.location.replace('/fi/'); }
  else if (lang.startsWith('es')) { window.location.replace('/es/'); }
  else { window.location.replace('/en/'); }
})();
</script>

</body>
</html>
